events {
    worker_connections 1024;
}

http {
    upstream api_servers {
        least_conn;
        server api.railway.internal:8000;
        server api-2.railway.internal:8000;
        server api-3.railway.internal:8000;
    }

    server {
        listen 80;

        location /api/ {
            # Handle CORS preflight at nginx — never hits the backend
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'  '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With';
                add_header 'Access-Control-Max-Age'       86400;
                add_header 'Content-Length'               0;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin'  '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

            proxy_pass http://api_servers;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        location /health {
            proxy_pass http://api_servers;
            proxy_set_header Host $host;
        }

        location /docs {
            proxy_pass http://api_servers;
        }

        location /openapi.json {
            proxy_pass http://api_servers;
        }
    }
}
