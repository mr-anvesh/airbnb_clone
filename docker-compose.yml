services:
  frontend:
    image: ${DOCKER_USERNAME:-yourusername}/scaler-frontend:latest
    build: ./frontend
    ports:
      - "${HOST_PORT:-80}:3000"
    environment:
      - BACKEND_URL=http://api-1:8000
      - INTERNAL_API_URL=http://api-1:8000
    depends_on:
      - api-1

  api-1:
    image: ${DOCKER_USERNAME:-yourusername}/scaler-backend:latest
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://airbnb:airbnb@postgres:5432/airbnb
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production-32chars}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    image: ${DOCKER_USERNAME:-yourusername}/scaler-backend:latest
    command: python -m workers.notification_worker
    environment:
      - DATABASE_URL=postgresql+psycopg://airbnb:airbnb@postgres:5432/airbnb
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production-32chars}
    depends_on:
      api-1:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airbnb
      POSTGRES_USER: airbnb
      POSTGRES_PASSWORD: airbnb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airbnb -d airbnb"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
