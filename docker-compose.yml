version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3
      - frontend

  frontend:
    image: ${DOCKER_USERNAME:-yourusername}/scaler-frontend:latest
    build: ./frontend
    environment:
      - INTERNAL_API_URL=http://nginx
    expose:
      - "3000"
    depends_on:
      - api-1

  api-1:
    image: ${DOCKER_USERNAME:-yourusername}/scaler-backend:latest
    build: ./backend
    environment:
      - DATABASE_URL=sqlite:///./data/airbnb.db
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    volumes:
      - sqlite_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api-2:
    image: ${DOCKER_USERNAME:-yourusername}/scaler-backend:latest
    build: ./backend
    environment:
      - DATABASE_URL=sqlite:///./data/airbnb.db
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    volumes:
      - sqlite_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api-3:
    image: ${DOCKER_USERNAME:-yourusername}/scaler-backend:latest
    build: ./backend
    environment:
      - DATABASE_URL=sqlite:///./data/airbnb.db
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    volumes:
      - sqlite_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    image: ${DOCKER_USERNAME:-yourusername}/scaler-backend:latest
    build: ./backend
    command: python -m workers.notification_worker
    environment:
      - DATABASE_URL=sqlite:///./data/airbnb.db
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    volumes:
      - sqlite_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sqlite_data:
