services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api-1
      - api-2
      - api-3

  api-1:
    image: ${DOCKER_USERNAME:-yourusername}/scaler-backend:latest
    build: ./backend
    environment:
      - DATABASE_URL=postgresql+psycopg://airbnb:airbnb@postgres:5432/airbnb
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - DB_POOL_SIZE=2
      - PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-2:
    image: ${DOCKER_USERNAME:-yourusername}/scaler-backend:latest
    environment:
      - DATABASE_URL=postgresql+psycopg://airbnb:airbnb@postgres:5432/airbnb
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - DB_POOL_SIZE=2
      - PORT=8000
    depends_on:
      api-1:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-3:
    image: ${DOCKER_USERNAME:-yourusername}/scaler-backend:latest
    environment:
      - DATABASE_URL=postgresql+psycopg://airbnb:airbnb@postgres:5432/airbnb
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - DB_POOL_SIZE=2
      - PORT=8000
    depends_on:
      api-1:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airbnb
      POSTGRES_USER: airbnb
      POSTGRES_PASSWORD: airbnb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airbnb -d airbnb"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
